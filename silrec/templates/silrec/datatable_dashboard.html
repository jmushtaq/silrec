{% load static %}
<div class="datatable-dashboard" data-model-name="{{ model_name }}" data-api-url="{{ api_url }}">
    {{ api_url }}
    <div class="card">
        <div class="card-header bg-light">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="card-title mb-0">{{ title|default:"Data Table" }}</h5>
                </div>
                <div class="col-md-6 text-end">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshTable">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm" id="exportExcel">
                            <i class="bi bi-file-earmark-excel"></i> Export Excel
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
           
            <div class="table-responsive">
                <table id="{{ table_id }}" class="table table-striped table-bordered table-hover" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            {% comment %}
                            {% for column in columns %}
                            <th data-data="{{ column.field }}">{{ column.title }}</th>
                            {% endfor %}
                            {% endcomment %}

                            <!-- Hardcoded columns - remove the template logic -->
                            <th data-data="lodgement_number">Lodgement Number</th>
                            <th data-data="title">Title</th>
                            <th data-data="proposal_type_name">Proposal Type</th>
                            <th data-data="lodgement_date_formatted">Lodgement Date</th>
                            <th data-data="processing_status_display">Status</th>
                            <!--
                            -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
