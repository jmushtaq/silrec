<!DOCTYPE html>
<html>
<head>
    <title>DataTable Test</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h3>DataTable Test</h3>
        <div id="debug-info" class="alert alert-info"></div>
        
        <div class="datatable-dashboard" data-api-url="/api/proposal-datatable/">
            <table id="testTable" class="table table-striped">
                <thead>
                    <tr>
                        <th>ID #</th>
                        <th>Lodgement #</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
    $(document).ready(function() {
        // First, let's test the API call directly
        $.ajax({
            url: '/api/proposal-datatable/',
            type: 'GET',
            success: function(response) {
                console.log('API Response:', response);
                $('#debug-info').html(
                    'API returned: ' + response.data.length + ' records. ' +
                    'Total: ' + response.recordsTotal + ', Filtered: ' + response.recordsFiltered
                );
                
                // Now initialize DataTable
                initializeDataTable();
            },
            error: function(xhr, status, error) {
                console.error('API Error:', error);
                $('#debug-info').html('API Error: ' + error);
            }
        });
        
        function initializeDataTable() {
            $('#testTable').DataTable({
                processing: true,
                serverSide: true,
                ajax: {
                    url: '/api/proposal-datatable/',
                    type: 'GET',
                    data: function(d) {
                        // Transform for server-side processing
                        return {
                            draw: d.draw,
                            start: d.start,
                            length: d.length,
                            search: d.search.value
                        };
                    },
                    dataSrc: function(json) {
                        console.log('DataTables received:', json);
                        return json.data;
                    }
                },
                columns: [
                    { data: 'id', title: 'ID #' },
                    { data: 'lodgement_number', title: 'Lodgement #' },
                    { data: 'title', title: 'Title' },
                    { data: 'proposal_type_name', title: 'Type' },
                    { data: 'lodgement_date_formatted', title: 'Date' },
                    { data: 'processing_status_display', title: 'Status' }
                ],
                dom: 'lrtip',
                pageLength: 10
            });
        }
    });
    </script>
</body>
</html>
