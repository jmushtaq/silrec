{% load static %}
<div class="datatable-dashboard" data-model-name="{{ model_name }}" data-api-url="{{ api_url }}">
    <div class="card">
        <div class="card-header bg-light">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="card-title mb-0">{{ title|default:"Data Table" }}</h5>
                </div>
                <div class="col-md-6 text-end">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshTable">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>

                        <!-- Export Excel Form -->
                        <form method="get" action="{% url 'export_proposals_excel' %}" id="exportExcelForm" style="display: inline;">
                            <input type="hidden" name="search" id="exportSearch">
                            <input type="hidden" name="status" id="exportStatus">
                            <input type="hidden" name="from_date" id="exportFromDate">
                            <input type="hidden" name="to_date" id="exportToDate">
                            <button type="submit" class="btn btn-outline-success btn-sm">
                                <i class="bi bi-file-earmark-excel"></i> Export Excel
                            </button>
                        </form>

                        <button type="button" class="btn btn-outline-danger btn-sm" id="clearFilters">
                            <i class="bi bi-x-circle"></i> Clear Filters
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">

            <!-- Filters Row -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Processing Status</label>
                    <select class="form-select form-select-sm" id="statusFilter" multiple>
                        <option value="draft">Draft</option>
                        <option value="with_assessor">With Assessor</option>
                        <option value="approved">Approved</option>
                        <option value="declined">Declined</option>
                        <option value="awaiting_payment">Awaiting Payment</option>
                        <option value="awaiting_approval">Awaiting Approval</option>
                    </select>
                    <small class="form-text text-muted">Select one or more statuses</small>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">From Lodgement Date</label>
                    <input type="date" class="form-control form-control-sm" id="fromDateFilter">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">To Lodgement Date</label>
                    <input type="date" class="form-control form-control-sm" id="toDateFilter">
                </div>
            </div>

            <div class="table-responsive">
                <table id="{{ table_id }}" class="table table-striped table-bordered table-hover" style="width:100%">
                    <thead class="table-light">
                        <tr>
                            <!-- Hardcoded columns -->
                            <th data-data="lodgement_number">Lodgement Number</th>
                            <th data-data="title">Title</th>
                            <th data-data="proposal_type_name">Proposal Type</th>
                            <th data-data="lodgement_date_formatted">Lodgement Date</th>
                            <th data-data="processing_status_display">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
