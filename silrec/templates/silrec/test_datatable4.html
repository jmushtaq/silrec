<!DOCTYPE html>
<html>
<head>
    <title>DataTable Data Structure Test</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h3>Data Structure Test</h3>
        <button id="inspectData" class="btn btn-warning mb-3">Inspect First Data Row</button>
        <div id="dataInspection" class="alert alert-secondary" style="display:none">
            <pre id="dataContent"></pre>
        </div>
        
        <table id="structureTable" class="table table-striped table-bordered" style="width:100%">
            <thead>
                <tr>
                    <th>Lodgement #</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
    $(document).ready(function() {
        var table = $('#structureTable').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
                url: '/api/proposal-datatable/',
                type: 'GET',
                data: function(d) {
                    return {
                        draw: d.draw,
                        start: d.start,
                        length: d.length,
                        search: d.search.value
                    };
                },
                dataSrc: function(json) {
                    console.log('Full data array:', json.data);
                    if (json.data && json.data.length > 0) {
                        console.log('First row structure:', json.data[0]);
                        console.log('Available keys in first row:', Object.keys(json.data[0]));
                    }
                    return json.data;
                }
            },
            columns: [
                { data: 'lodgement_number' },
                { data: 'title' },
                { data: 'proposal_type_name' },
                { data: 'lodgement_date_formatted' },
                { data: 'processing_status_display' }
            ]
        });
        
        $('#inspectData').click(function() {
            var data = table.data();
            if (data.length > 0) {
                $('#dataContent').text(JSON.stringify(data[0], null, 2));
                $('#dataInspection').show();
            }
        });
    });
    </script>
</body>
</html>
