<!DOCTYPE html>
<html>
<head>
    <title>DataTable Test</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="datatable-dashboard" data-api-url="/api/proposal-datatable/">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th data-data="lodgement_number">Lodgement #</th>
                        <th data-data="title">Title</th>
                        <th data-data="proposal_type_name">Type</th>
                        <th data-data="lodgement_date_formatted">Date</th>
                        <th data-data="processing_status_display">Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
    // Simple test implementation
    $(document).ready(function() {
        $('table').DataTable({
            processing: true,
            serverSide: true,
            ajax: '/api/proposal-datatable/',
            columns: [
                { data: 'lodgement_number' },
                { data: 'title' },
                { data: 'proposal_type_name' },
                { data: 'lodgement_date_formatted' },
                { data: 'processing_status_display' }
            ]
        });
    });
    </script>
</body>
</html>
