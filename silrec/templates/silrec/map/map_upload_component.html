<div class="map-upload-container">
    <div class="upload-controls">
        <input type="file" id="shapefile-upload" accept=".zip" style="display: none;">
        <button id="upload-shapefile-btn" class="btn btn-primary">
            <i class="upload-icon">📁</i> Upload Shapefile
        </button>
        <span id="selected-filename" class="selected-filename"></span>
        <div id="upload-progress" class="upload-progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="progress-text">Processing...</span>
        </div>
    </div>
</div>
